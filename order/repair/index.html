<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>修理依頼書・紛失保証注文書 | NJH</title>
<script src="./pdf-lib.min.js"></script>
<style>
:root{--blue:#1d4e89;--line:#d7dee8;--bg:#f4f6f9}
*{box-sizing:border-box}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:#1c2733}
header{background:var(--blue);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0}
header p{margin:3px 0 0;font-size:12px;opacity:.85}
main{max-width:860px;margin:0 auto;padding:12px}
nav{display:flex;gap:8px;margin-bottom:12px}
nav button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:700;cursor:pointer}
nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 8px;color:var(--blue)}
label{display:block;font-size:12px;color:#55606c;margin:8px 0 3px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:9px;border:1px solid:#b9c4d1;border-radius:8px;font-size:15px;background:#fff}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:999px;border:1px solid #b9c4d1;background:#fff;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.note{font-size:12px;color:#66707c}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns button{flex:1;min-width:140px;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
.b-pdf{background:#1d4e89;color:#fff}
.b-print{background:#e8edf4;color:#1c2733;border:1px solid var(--line)}
canvas{width:100%;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
#linkInfo{font-size:13px;color:#1d4e89;font-weight:700;margin-bottom:8px}
a.back{color:#fff;font-size:12px;opacity:.9;text-decoration:none}
.mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* レスポンシブ追加 */
@media(min-width:1024px){main{max-width:980px}}
@media(max-width:768px){input[type=text],input[type=date],input[type=number],select,textarea{font-size:16px}}
@media(max-width:560px){.g3{grid-template-columns:1fr 1fr}.btns button{min-width:46%}}
@media(max-width:400px){.g3{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>修理・紛失の依頼書</h1>
<p>補聴器を選ぶと 店名・氏名・シリアル・購入日 が自動で入ります。<a class="back" href="../../index.html" style="background:#ff7a00;color:#fff;font-weight:700;padding:7px 14px;border-radius:999px;text-decoration:none;display:inline-block;font-size:14px;white-space:nowrap">🏠 ホームに戻る</a></p>
</header>
<main>
<nav>
<button type="button" data-form="repair">🔧 修理依頼書</button>
<button type="button" data-form="loss">📄 紛失保証注文書</button>
</nav>
<div id="linkInfo"></div>
<div id="secs"></div>
<div class="card">
<h2>プレビュー</h2>
<canvas id="cv" width="1654" height="2339"></canvas>
<div class="btns">
<button type="button" class="b-pdf" id="dl">PDFで保存</button>
<button type="button" class="b-print" id="pr">印刷</button><button type="button" id="clr" style="background:#eee">入力をクリア</button>
</div>
<p class="note" id="dlNote"></p>
</div>
</main>

const ACCS=[['case','ケース',120,143,665.8],['earmold','イヤモールド（R・L）',228,306,665.8],['hookacc','フック（ノーマル・ダンパー）',367,467,665.8],['hosho','保証書',518,545,665.8],['battery','電池',120,136,679.8],['mold','モールド（R・L）',229,290,679.8],['slim','スリムチューブ（R・L）',367,451,679.8],['mesu','メス型',518,543,679.8],['charger2','充電器',120,145,693.7],['ac','ACアダプター・充電ケーブル',228,357,693.7],['mihon','見本補聴器',411,459,693.7],['sonota','その他',120,146,707.7]];
const defCommon=()=>({shop:'',staff:'',tel:'',fax:'',cust:'',model:'',noR:'',noL:'',buy:''});
const defRepair=()=>({dateR:today(),kinds:[],syms:[],days:'',hours:'',tegusType:'',tegusMm:'',hf4text:'',comment:'',shopConfirm:false,accs:[],caseNum:'',batNum:'',mihonText:'',sonotaText:'',telConsult:false,memo:'',arrival:''});
const defLoss=()=>({date:today(),serial:'',amount:'',todokePlace:'',todokeTel:'',todokeDate:'',todokeNo:'',colorL:'',colorR:'',sizeL:'',sizeR:'',domeL:'',domeR:''});
let V; try{V=JSON.parse(localStorage.getItem('njh_req_v1')||'null')}catch(e){V=null}
if(!V||!V.repair||!V.loss||!V.common)V={form:'repair',common:defCommon(),repair:defRepair(),loss:defLoss(),haSel:-1,ear:'B'};
const save=()=>{try{localStorage.setItem('njh_req_v1',JSON.stringify(V))}catch(e){}};
const P=new URLSearchParams(location.search);
let CID=P.get('cid')||'';
let RID=P.get('rid')||'';
if(!CID&&location.hash){const m=location.hash.match(/cid=(\d+)/);if(m)CID=m[1]}
const fparam=P.get('form')||((location.hash.match(/form-(repair|loss)/)||[])[1])||'';
if(fparam&&FORMS[fparam])V.form=fparam;
for(const k of['shop','staff','tel','fax','cust'])if(P.get(k))V.common[k]=P.get(k);
let CUST=null,HAS=[];
try{const D=JSON.parse(localStorage.getItem('njhc')||'null');
 if(D){if(!V.common.shop&&D.shop){V.common.shop=D.shop.name||'';V.common.staff=D.shop.staff||'';V.common.tel=D.shop.tel||'';V.common.fax=D.shop.fax||''}
  if(CID){CUST=(D.cs||[]).find(x=>String(x.id)===String(CID))||null;
   if(CUST){HAS=(CUST.ha||[]).filter(h=>h&&(h.buy||(h.R&&h.R.model)||(h.L&&h.L.model)));if(!V.common.cust)V.common.cust=CUST.name||''}}}}catch(e){}
if(V.haSel<0||V.haSel>=HAS.length)V.haSel=HAS.length-1;
function addY2(d,y){if(!d||!y)return'';const t=new Date(d+'T00:00:00');if(isNaN(t))return'';t.setFullYear(t.getFullYear()+ +y);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function flatP2(h){const lim=addY2(h.buy,5);return lim&&today()<=lim?'26,000円（購入から5年以内）':'52,000円（購入から5年を経過）'}
function deriveSerial(){const c=V.common;if(V.ear==='R')return c.noR||'';if(V.ear==='L')return c.noL||'';return[c.noR&&'右 '+c.noR,c.noL&&'左 '+c.noL].filter(Boolean).join('　')}
function applyHa(){const rec=HAS[V.haSel];if(!rec)return;const c=V.common;c.buy=rec.buy||'';const rm=rec.R&&rec.R.model||'',lm=rec.L&&rec.L.model||'';
 c.model=V.ear==='R'&&rm?rm:V.ear==='L'&&lm?lm:(rm&&lm&&rm!==lm?rm+' / '+lm:rm||lm);
 c.noR=rec.R&&rec.R.no||'';c.noL=rec.L&&rec.L.no||'';V.loss.serial=deriveSerial();if(rec.lgAmt)V.loss.amount=rec.lgAmt}
function getP(p){return p.split('.').reduce((o,k)=>o[k],V)}
function setP(p,v){const ks=p.split('.');const o=ks.slice(0,-1).reduce((o,k)=>o[k],V);o[ks[ks.length-1]]=v}
function chipsHtml(path,items,single){const cur=getP(path);return `<div class="chips">${items.map(([id,label])=>{const on=single?(cur===id||(cur===true&&id==='1')):(cur||[]).includes(id);return `<button type="button" class="chip${on?' on':''}" data-chip="${path}|${id}|${single?1:0}">${esc(label)}</button>`}).join('')}</div>`}
function inp(path,label,type='text',ph=''){return `<div><label>${label}</label><input type="${type}" data-b="${path}" value="${esc(getP(path))}" placeholder="${ph}"></div>`}
function haSection(){if(!HAS.length)return `<div class="card"><h2>補聴器の選択</h2><p class="note">補聴器の情報は下の欄に入力してください。</p></div>`;
 const rec=HAS[V.haSel];
 return `<div class="card"><h2>どの補聴器ですか？（選ぶと自動入力）</h2>
 <label>購入記録</label><div class="chips">${HAS.map((h,i)=>`<button type="button" class="chip${i===V.haSel?' on':''}" data-ha="${i}">${esc(h.buy||'購入日不明')}：${esc((h.R&&h.R.model)||(h.L&&h.L.model)||'')}</button>`).join('')}</div>
 <label>対象</label><div class="chips">${[['R','右耳'],['L','左耳'],['B','両耳']].map(([id,t])=>`<button type="button" class="chip${V.ear===id?' on':''}" data-ear="${id}">${t}</button>`).join('')}</div>
 <p class="note">選択中の補聴器：${esc(rec?(rec.buy||'')+'　右：'+((rec.R&&rec.R.model)||'')+'（'+((rec.R&&rec.R.no)||'')+'）　左：'+((rec.L&&rec.L.model)||'')+'（'+((rec.L&&rec.L.no)||'')+'）':'')}</p>${rec&&rec.buy?'<p class="note">一律修理の目安：'+flatP2(rec)+'</p>':''}</div>`}
function commonSection(){const c='common';return `<div class="card"><h2>お店・お客様情報（自動入力）</h2><div class="g2">
 ${inp(c+'.shop','貴店名')}${inp(c+'.staff','ご担当者')}
 ${inp(c+'.tel','電話番号')}${inp(c+'.fax','FAX番号')}
 ${inp(c+'.cust','お客様名')}${inp(c+'.buy','購入日（販売日）','date')}
 </div><div class="g2">${inp(c+'.model','器種名')}</div>
 <div class="g2">${inp(c+'.noR','製造No（右）')}${inp(c+'.noL','製造No（左）')}</div></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.form===V.form));
 $('#linkInfo').textContent=CUST?`顧客管理と連携中：${CUST.name||''} 様（カルテNo.${CUST.no||''}）`:'';
 const v=V[V.form];let h=haSection()+commonSection();
 if(V.form==='repair'){h+=`<div class="card"><h2>① 修理の種類</h2>${chipsHtml('repair.kinds',KINDS)}
  ${v.kinds.includes('hf4')?inp('repair.hf4text','HF4の内容（　）内') :''}
  ${inp('repair.dateR','貴店受付日','date')}</div>
  <div class="card"><h2>③ 故障状況（当てはまるものを選択）</h2>${chipsHtml('repair.syms',SYMS.map(s=>[s[0],s[1]]))}
  <div class="g3">${inp('repair.days','電池寿命早い（日数）','number')}${inp('repair.hours','充電寿命早い（時間）','number')}${inp('repair.tegusMm','テグス（mm）','number')}</div>
  <label>テグス取付の種類</label>${chipsHtml('repair.tegusType',[['1','1本'],['ring','輪']],true)}</div>
  <div class="card"><h2>コメント・付属品</h2>
  <label>コメント</label><textarea rows="2" data-b="repair.comment">${esc(v.comment)}</textarea>
  <div style="margin-top:6px">${chipsHtml('repair.shopConfirm',[['1','お店で上記の症状確認']],true)}</div>
  <label style="margin-top:10px">付属品（同封するもの）</label>${chipsHtml('repair.accs',ACCS.map(a=>[a[0],a[1]]))}
  <div class="g2">${inp('repair.caseNum','ケース（個数）')}${inp('repair.batNum','電池（個数）')}</div>
  <div class="g2">${inp('repair.mihonText','見本補聴器（内容）')}${inp('repair.sonotaText','その他（内容）')}</div></div>
  <div class="card"><h2>備考・到着希望日</h2>
  ${chipsHtml('repair.telConsult',[['1','電話相談希望']],true)}
  <label>備考</label><textarea rows="2" data-b="repair.memo">${esc(v.memo)}</textarea>
  ${inp('repair.arrival','ご到着希望日（空欄＝標準の5営業日発送）','date')}</div>`}
 else{h+=`<div class="card"><h2>基本情報</h2><div class="g2">${inp('loss.date','ご注文日','date')}${inp('loss.serial','紛失補聴器のシリアルNO.')}</div>
  <label>今回のご注文品（金額）</label>${chipsHtml('loss.amount',[['all','全額'],['half','半額']],true)}
  <p class="note">右のみ・左のみ・両耳は上の「対象」で選んでください。</p></div>
  <div class="card"><h2>紛失届</h2><div class="g2">
  ${inp('loss.todokePlace','届出先（警察署・交番名）')}${inp('loss.todokeTel','届出先 連絡先')}
  ${inp('loss.todokeDate','届出年月日','date')}${inp('loss.todokeNo','紛失届 番号')}</div></div>
  <div class="card"><h2>再作の指定（タイプ・サイズ・カラー）</h2><div class="g2">
  ${inp('loss.colorL','カラー（左）')}${inp('loss.colorR','カラー（右）')}
  ${inp('loss.sizeL','レシーバーサイズ（左）')}${inp('loss.sizeR','レシーバーサイズ（右）')}
  ${inp('loss.domeL','耳せん（左）')}${inp('loss.domeR','耳せん（右）')}</div>
  <p class="note">サイン欄は印刷後に手書きでご記入ください。</p></div>`}
 $('#secs').innerHTML=h;bind();draw()}
function bind(){document.querySelectorAll('[data-b]').forEach(el=>{el.oninput=()=>{setP(el.dataset.b,el.value);save();draw()}});
 document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{const[path,id,single]=b.dataset.chip.split('|');
  if(path==='repair.shopConfirm'){V.repair.shopConfirm=!V.repair.shopConfirm}
  else if(path==='repair.telConsult'){V.repair.telConsult=!V.repair.telConsult}
  else if(single==='1'){setP(path,getP(path)===id?'':id);if(path==='loss.amount'){} }
  else{const a=getP(path);const i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id)}
  save();render()});
 document.querySelectorAll('[data-ha]').forEach(b=>b.onclick=()=>{V.haSel=+b.dataset.ha;applyHa();save();render()});
 document.querySelectorAll('[data-ear]').forEach(b=>b.onclick=()=>{V.ear=b.dataset.ear;applyHa();save();render()});

</script>
<script>
const cv=$('#cv'),ctx=cv.getContext('2d'),bg=new Image();
let K=2.778;
function T(t,x,y,s=12,align='left'){if(t==null||t==='')return;ctx.font=s+'px "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif';ctx.fillStyle='#111';ctx.textAlign=align;ctx.fillText(String(t),x,y)}
function RA(t,x,y,s){T(t,x,y,s,'right')}
function TFit(t,x,y,s,maxW){if(t==null||t==='')return;ctx.font=s+'px "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif';const w=ctx.measureText(String(t)).width;if(w>maxW)s=Math.max(7,s*maxW/w);T(t,x,y,s)}
function CK(cx,cy,s=15){ctx.font='bold '+s+'px sans-serif';ctx.fillStyle='#111';ctx.textAlign='center';ctx.fillText('✓',cx,cy+s*0.36)}
function EL(cx,cy,rx,ry){ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke()}
function dp(ds){if(!ds)return null;const[a,b,c]=String(ds).split('-').map(Number);return a?{y:a,m:b,d:c}:null}
function fmtTel(v){const d=String(v||'').replace(/[^0-9]/g,'');if(!d)return'';if(d.length===10)return d.slice(0,3)+'（'+d.slice(3,6)+'）'+d.slice(6);if(d.length===11)return d.slice(0,3)+'（'+d.slice(3,7)+'）'+d.slice(7);return d}
function dRA(ds,ends,y,s=11){const p=dp(ds);if(!p)return;RA(p.y,ends[0],y,s);RA(p.m,ends[1],y,s);RA(p.d,ends[2],y,s)}
function wrap(text,x,y,maxW,s,lh,maxLines){if(!text)return;ctx.font=s+'px "Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif';ctx.fillStyle='#111';ctx.textAlign='left';let line='',n=0;
 for(const ch of String(text)){if(ctx.measureText(line+ch).width>maxW&&line){ctx.fillText(line,x,y+n*lh);n++;line=ch;if(n>=maxLines)return}else line+=ch}
 if(line&&n<maxLines)ctx.fillText(line,x,y+n*lh)}
function draw(){const f=FORMS[V.form];if(cv.width!==f.W){cv.width=f.W;cv.height=f.H}
 if(bg.dataset.f!==V.form){bg.dataset.f=V.form;bg.src=f.bg;bg.onload=()=>draw();if(!bg.complete)return}
 if(!bg.complete||!bg.naturalWidth)return;
 K=f.W/f.pw;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.drawImage(bg,0,0,cv.width,cv.height);ctx.setTransform(K,0,0,K,0,0);
