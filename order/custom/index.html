body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Hiragino Sans","Yu Gothic",Meiryo,"Noto Sans JP",sans-serif}
header{padding:12px 16px 4px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:17px;margin:0;color:var(--ac)}

header>p{margin:6px 0 0;color:var(--mu);font-size:12.5px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px}

nav button.on{border-color:var(--ac);background:var(--ac2)}
main{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:14px;padding:0 16px 24px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}#pv{order:-1;position:static!important}}
#ui,#pv{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px}

h2{font-size:13px;margin:14px 0 6px;color:var(--ac);border-bottom:1px solid var(--ln);padding-bottom:3px}

.req{color:#c62828;font-weight:700;font-size:11px}

.dt{display:flex;gap:6px;align-items:center}
.dt input{width:4.4em;text-align:center}
.dt input.y{width:5.4em}
.phone3{gap:4px}
.phone3 input{width:4em!important}

.ear{font-size:11px;color:var(--mu);margin:4px 0 1px}

.ear-choice .ear-label{font-size:12px;font-weight:700;margin-bottom:4px}
.ear-choice.R{background:#fff3f3;border-color:#e6a4a4}

.ear-choice.L{background:#f1f5ff;border-color:#9eb5e8}
.ear-choice.L .ear-label{color:#2457a6}

const fit=(t,w,fs,a,x,y)=>{
  ctx.font=(fs*S)+"px "+FONT;
  const m=ctx.measureText(t).width/S;
  ctx.save();ctx.translate(x*S,y*S);
  let k=1;if(w&&m>w)k=w/m;
  ctx.scale(k,1);
  ctx.textAlign=a==="r"?"right":a==="c"?"center":"left";
  ctx.fillText(t,0,0);ctx.restore();
};
function chk(x,y,s=10){
  ctx.save();ctx.lineWidth=1.6*S;ctx.lineCap=ctx.lineJoin="round";ctx.strokeStyle="#0b2a6b";
  ctx.beginPath();ctx.moveTo((x-s*.34)*S,(y+s*.02)*S);ctx.lineTo((x-s*.08)*S,(y+s*.32)*S);ctx.lineTo((x+s*.42)*S,(y-s*.42)*S);ctx.stroke();ctx.restore();
}
function circ(x,y,r){
  ctx.save();ctx.lineWidth=1.2*S;ctx.strokeStyle="#0b2a6b";
  ctx.beginPath();ctx.arc(x*S,y*S,r*S,0,7);ctx.stroke();ctx.restore();
}
function ell(cx,cy,rx,ry){
  ctx.save();ctx.lineWidth=1.2*S;ctx.strokeStyle="#0b2a6b";
  ctx.beginPath();ctx.ellipse(cx*S,cy*S,rx*S,ry*S,0,0,7);ctx.stroke();ctx.restore();
}
function mark(f,i,e){
  const o=f.o[i];
  if(f.m==="e"){ell(o[1][0],o[1][1],o[2],9.5);return}
  if(f.s){const p=(V[f.s]===1?o[2]:o[1]);if(p)chk(p[0],p[1]);return}
  const p=(e==="L"&&o[2])?o[2]:o[1];
  f.m==="o"?circ(p[0],p[1],f.r||7):chk(p[0],p[1]);
}

function draw(){
  cv.width=595*S;cv.height=842*S;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle="#0b2a6b";ctx.textBaseline="alphabetic";
  const nn=v=>v==null?"":String(v).trim();

  cur.f.forEach(f=>{
    const t=f.t;
    if(t==="t"&&nn(V[f.k]))fit(nn(V[f.k]),f.w,f.fs,f.a,f.x,f.y);
    if(t==="ph"&&f.d){
      fit(nn(V.tel1),30,9,"r",f.d[0][0],f.d[0][1]);
      fit(nn(V.tel2),24,9,"l",f.d[1][0],f.d[1][1]);
      fit(nn(V.tel3),24,9,"l",f.d[2][0],f.d[2][1]);
    }
    if(t==="tx"&&nn(V[f.k])&&(!f.cond||V[f.cond[0]]===f.cond[1])){if(f.k==="wish"){const wm=String(V.wish).match(/(?:\d{4}\D*)?(\d{1,2})\D+(\d{1,2})/);if(wm){fit(wm[1],24,9.5,"r",519,f.y);fit(wm[2],24,9.5,"l",533,f.y)}else fit(nn(V[f.k]),f.w,f.fs,f.a,f.x,f.y)}else fit(nn(V[f.k]),f.w,f.fs,f.a,f.x,f.y)}
    if(t==="nm"&&V.nm){chk(f.p[0],f.p[1],10);if(nn(V.nmText))fit(nn(V.nmText).slice(0,15),f.w,7.5,"l",f.x+2,f.y-1)}
    if(t==="d"){["Y","M","D"].forEach((s,i)=>{const v=nn(V[f.k+s]);if(v)fit(v,30,f.fs,"r",f.xs[i],f.y)})}
    if(t==="bd"){
      const v=["bY","bM","bD"].map(k=>nn(V[k]));
      f.xs.slice(0,3).forEach((x,i)=>v[i]&&fit(v[i],34,10,"r",x,f.y));
      const a=calcAge(v[0],v[1],v[2]);if(a!=="")fit(a,16,10,"r",f.xs[3],f.y);
    }
    if(t==="c"&&V[f.k])chk(f.p[0],f.p[1],10);
    if(t==="r"){
      if(f.e)["R","L"].forEach(e=>{if(act(e)&&V[f.k+e]!=null)mark(f,V[f.k+e],e)});
      else if(V[f.k]!=null)mark(f,V[f.k],"R");
    }
  });

  // 備考
  if(cur.note&&nn(V.free)){
    const L=nn(V.free).split("\n").filter(Boolean);
    L.slice(0,cur.note.n).forEach((t,i)=>fit(t,cur.note.w,cur.note.fs,"l",cur.note.x,cur.note.y+i*cur.note.lh));
  }

  // オージオグラム描画
  if(cur.audio){
    const A=cur.audio,fr=Object.keys(A.x).map(Number),py=d=>A.y0+d*A.k;
    ["R","L"].forEach(e=>{
      if(!act(e))return;
      const pts=fr.filter(f=>nn(V["a"+e+f])!=="").map(f=>[A.x[f],py(+V["a"+e+f])]);
      if(!pts.length)return;
      ctx.save();
      ctx.strokeStyle=e==="R"?"#d01818":"#1747c8";
      ctx.lineWidth=.9*S;
      ctx.beginPath();
      pts.forEach((p,i)=>i?ctx.lineTo(p[0]*S,p[1]*S):ctx.moveTo(p[0]*S,p[1]*S));
      ctx.stroke();
      pts.forEach(p=>{
        ctx.fillStyle="#fff";
        if(e==="R"){ctx.beginPath();ctx.arc(p[0]*S,p[1]*S,3.4*S,0,7);ctx.fill();ctx.stroke()}
        else{
          const r=3.2*S,x=p[0]*S,y=p[1]*S;
          ctx.beginPath();ctx.moveTo(x-r,y-r);ctx.lineTo(x+r,y+r);ctx.moveTo(x+r,y-r);ctx.lineTo(x-r,y+r);
          ctx.lineWidth=1.3*S;ctx.stroke();ctx.lineWidth=.9*S;
        }
      });
      ctx.restore();
    });
    ["R","L"].forEach(e=>{
      if(!act(e))return;
      const pts=fr.filter(f=>nn(V["b"+e+f])!=="").map(f=>[A.x[f],py(+V["b"+e+f])]);
      if(!pts.length)return;
      ctx.save();
      ctx.strokeStyle=e==="R"?"#d01818":"#1747c8";
      ctx.lineWidth=.8*S;
      ctx.beginPath();
      pts.forEach((p,i)=>i?ctx.lineTo(p[0]*S,p[1]*S):ctx.moveTo(p[0]*S,p[1]*S));
      ctx.stroke();
      ctx.lineWidth=1.2*S;
      pts.forEach(p=>{
        const x=p[0]*S,y=p[1]*S,r=3.4*S;
        ctx.beginPath();
        if(e==="R"){ctx.moveTo(x+r,y-r);ctx.lineTo(x-r*.4,y-r);ctx.lineTo(x-r*.4,y+r);ctx.lineTo(x+r,y+r)}
        else{ctx.moveTo(x-r,y-r);ctx.lineTo(x+r*.4,y-r);ctx.lineTo(x+r*.4,y+r);ctx.lineTo(x-r,y+r)}
        ctx.stroke();
      });
      ctx.restore();
    });
    if(nn(V.mdate)){ctx.fillStyle="#0b2a6b";fit(nn(V.mdate),42,7,"l",A.dx,A.dy)}
  }
}

function validateOrder(){
  const missing=[];
  const labels={shop:"貴店名",staff:"ご担当者",cust:"お客様名",g:"グレード",pw:"パワー",shape:"器種",ch:"充電器"};
  ["shop","staff","cust"].forEach(k=>{if(!String(V[k]||"").trim())missing.push(labels[k]||k)});
  if(cur.audio){const hasAu=["R","L"].some(e=>act(e)&&Object.keys(cur.audio.x).some(f=>String(V["a"+e+f]??"").trim()!==""));if(!hasAu)missing.push("気導オージオグラム")}
  if(cur.id==="smr"){if(V.g==null)missing.push("グレード");if(V.pw==null)missing.push("パワー")}
  if(cur.id==="bel"){if(V.shape===1&&V.pw===0)return{ok:false,message:"カスタムDWCにLPはありません。パワーを選び直してください。"};if(V.shape==null)missing.push("器種");if(act("R")&&V.pwR==null&&act("L")&&V.pwL==null&&V.pw==null){/* power is ear */}}
  if(V.nm){const n=String(V.nmText||"").trim();if(!n)missing.push("名入れ文字");else if(!namePattern.test(n))return{ok:false,message:"名入れはひらがな・カタカナ・アルファベットで入力してください。"}}
  return missing.length?{ok:false,message:"必須項目を入力してください："+missing.join("、")}:{ok:true};
}

const ob=(no,body)=>{off[no]=len;add(no+" 0 obj\n");if(typeof body==="string")add(body);else body();add("\nendobj\n")};
ob(1,"<</Type/Catalog/Pages 2 0 R>>");
ob(2,"<</Type/Pages/Kids["+imgs.map((_,i)=>(3+3*i)+" 0 R").join(" ")+"]/Count "+n+">>");
imgs.forEach((im,i)=>{const pg=3+3*i;ob(pg,"<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 "+(pg+1)+" 0 R>>>>/Contents "+(pg+2)+" 0 R>>");ob(pg+1,()=>{add("<</Type/XObject/Subtype/Image/Width "+im.w+"/Height "+im.h+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+im.bytes.length+">>\nstream\n");add(im.bytes);add("\nendstream")});const cn="q 595.28 0 0 841.89 0 0 cm /Im0 Do Q";ob(pg+2,"<</Length "+cn.length+">>\nstream\n"+cn+"\nendstream")});
const xo=len;add("xref\n0 "+(total+1)+"\n0000000000 65535 f \n");for(let i=1;i<=total;i++)add(String(off[i]).padStart(10,"0")+" 00000 n \n");add("trailer<</Size "+(total+1)+"/Root 1 0 R>>\nstartxref\n"+xo+"\n%%EOF");
return new Blob(parts,{type:"application/pdf"});
}
function bothState(){
const b=$("both"),h=$("bothHint");if(!b)return;
const okF=validateOrder().ok,n=readPartsCart().length,ok=okF&&n>0;
b.disabled=!ok;
let m="";
if(!okF&&!n)m="補聴器の必須項目と、備品の両方を入力すると押せます";
else if(!okF)m="補聴器の注文書が未入力です（必須項目を入力してください）";
else if(!n)m="備品が未入力です（「🔩 備品も注文」から追加してください）";
else m="送信内容：補聴器 "+cur.name+" ＋ 備品 "+n+"品目（2ページPDF）";
if(h){h.textContent=m;h.style.color=ok?"#2f855a":""}
}

/* ===== 顧客管理データベースへの保存（紐付け） ===== */
let CID=null,OID=null,DB_CUST=null;
try{const q2=new URLSearchParams(location.search);CID=q2.get("cid")?+q2.get("cid"):null;OID=q2.get("oid")?+q2.get("oid"):null}catch(e){}
function loadDb(){try{return JSON.parse(localStorage.getItem("njhc")||"{}")}catch(e){return{}}}
function findCust(db){
const cs=(db&&db.cs)||[];
if(CID){const c=cs.find(x=>x.id===CID);if(c)return{cust:c,how:"id"}}
const nm=String(V.cust||"").trim();
if(nm){const m=cs.filter(x=>String(x.name||"").trim()===nm);if(m.length===1)return{cust:m[0],how:"name"};if(m.length>1)return{cust:null,how:"dup"}}
return{cust:null,how:"none"};
}
function dbRestore(){
if(!OID)return;
const db=loadDb();const f=findCust(db);
if(!f.cust)return;
const o=(f.cust.orders||[]).find(x=>x.id===OID);
if(o&&o.data){Object.assign(V,o.data);DB_CUST=f.cust}
}
function dbInfoUpdate(){
const e=$("dbInfo");if(!e)return;
const db=loadDb();const f=findCust(db);
if(f.cust){DB_CUST=f.cust;e.textContent="🗄 顧客管理と連携中："+(f.cust.name||"")+" 様（カルテNo."+(f.cust.no||"")+"）"+(OID?"／保存済みの注文を編集中です":"");e.style.color="#2f855a"}
else if(f.how==="dup"){DB_CUST=null;e.textContent="🗄 同じ名前の顧客が複数いるため、自動で紐付けできません。顧客管理の顧客画面から注文書を開いてください。";e.style.color="#b45309"}
else{DB_CUST=null;e.textContent="🗄 顧客管理と未連携です（顧客管理の顧客画面から注文書を開くと自動で紐付きます）";e.style.color="#b45309"}
}
function orderSummary(){
const parts=[];
if(cur.id==="smr"){const g=cur.f.find(x=>x.k==="g"),pw=cur.f.find(x=>x.k==="pw");if(g&&V.g!=null)parts.push("グレード"+g.o[V.g][0]);if(pw&&V.pw!=null)parts.push(pw.o[V.pw][0])}
if(cur.id==="bel"){const sh=cur.f.find(x=>x.k==="shape");if(sh&&V.shape!=null)parts.push(sh.o[V.shape][0])}
parts.push(EN[V.ears]||"");
if(V.total)parts.push("合計 "+V.total+"円");
return parts.filter(Boolean).join("／");
}
if($("dbSave"))$("dbSave").onclick=()=>{
const m=$("msg");
const chk=validateOrder();
if(!chk.ok){m.textContent=chk.message;return}
const db=loadDb();
const f=findCust(db);
if(!f.cust){m.textContent=f.how==="dup"?"同じ名前の顧客が複数います。顧客管理の顧客画面から注文書を開いて保存してください。":"顧客管理に該当の顧客が見つかりません。顧客管理に登録して、その顧客画面から注文書を開いてください。";return}
const cust=f.cust;
if(!Array.isArray(cust.orders))cust.orders=[];
const rec={id:OID||Date.now(),date:(V.odY||"")+"/"+(V.odM||"")+"/"+(V.odD||""),formId:cur.id,mid:MID[cur.id]||cur.id,formName:cur.name,cust:V.cust||cust.name||"",summary:orderSummary(),total:V.total||"",data:JSON.parse(JSON.stringify(V)),savedAt:Date.now()};
const ix=cust.orders.findIndex(x=>x.id===rec.id);
if(ix>=0)cust.orders[ix]=rec;else cust.orders.push(rec);
try{localStorage.setItem("njhc",JSON.stringify(db))}catch(e){m.textContent="保存できませんでした（端末の容量不足の可能性があります）";return}
OID=rec.id;CID=cust.id;DB_CUST=cust;
m.textContent="データベースに保存しました："+(cust.name||"")+" 様の注文履歴（"+rec.date+" "+rec.formName+"）";
dbInfoUpdate();
};

if($("toCust"))$("toCust").onclick=()=>{
const m=$("msg");
const chk=validateOrder();
if(!chk.ok){m.textContent=chk.message;return}
const db=loadDb();
const f=findCust(db);
if(!f.cust){

try{localStorage.setItem("njh_custom_v",JSON.stringify(V))}catch(e){}
location.href="../../customer.html";return;
}

if(!Array.isArray(cust.orders))cust.orders=[];
const rec={id:OID||Date.now(),date:(V.odY||"")+"/"+(V.odM||"")+"/"+(V.odD||""),formId:cur.id,mid:MID[cur.id]||cur.id,formName:cur.name,cust:V.cust||cust.name||"",summary:orderSummary(),total:V.total||"",data:JSON.parse(JSON.stringify(V)),savedAt:Date.now()};
const ix=cust.orders.findIndex(x=>x.id===rec.id);
if(ix>=0)cust.orders[ix]=rec;else cust.orders.push(rec);
try{localStorage.setItem("njhc",JSON.stringify(db))}catch(e){m.textContent="保存できませんでした（端末の容量不足の可能性があります）";return}
OID=rec.id;CID=cust.id;DB_CUST=cust;
try{localStorage.setItem("njh_open_cust",JSON.stringify({id:cust.id,tab:"o"}))}catch(e){}
location.href="../../customer.html";
};
$("go").onclick=async()=>{
  const m=$("msg");
  const check=validateOrder();
  if(!check.ok){m.textContent=check.message;return}
  m.textContent="作成中…";
  try{
    if(!window.PDFLib)throw new Error("PDF部品を読み込めませんでした。");
    draw();
    const png=await new Promise(r=>cv.toBlob(r,"image/png"));
    const bin=new Uint8Array(await(await fetch(PDFS[cur.pdf])).arrayBuffer());
    const doc=await PDFLib.PDFDocument.load(bin);
    const pg=doc.getPage(0);
    const im=await doc.embedPng(new Uint8Array(await png.arrayBuffer()));
    const sz=pg.getSize();
    pg.drawImage(im,{x:0,y:0,width:sz.width,height:sz.height});
    const out=await doc.save();
    const ymd=td.getFullYear()+("0"+(td.getMonth()+1)).slice(-2)+("0"+td.getDate()).slice(-2);
    const name="注文書_"+cur.name.replace(/\s/g,"")+"_"+ymd+".pdf";
    const a=el("a",{href:URL.createObjectURL(new Blob([out],{type:"application/pdf"})),download:name});
    document.body.appendChild(a);a.click();a.remove();
    m.textContent="保存しました："+name;
  }catch(e){m.textContent="保存できませんでした："+(e.message||e)}
};

$("print").onclick=()=>{
  const check=validateOrder();
  if(!check.ok){$("msg").textContent=check.message;return}
  draw();window.print();
};
